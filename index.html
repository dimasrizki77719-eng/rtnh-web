<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rtnh | Digital Profile</title>
    <style>
        :root {
            --accent-color: #0088ff; 
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .profile-card {
            width: 85%;
            max-width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 25px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.3);
        }

        h1 { font-size: 24px; margin-bottom: 6px; }
        .bio { font-size: 14px; color: #888; margin-bottom: 35px; }

        /* BAGIAN TOMBOL (BUTTON) */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: white;
            color: black;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
            display: block; /* Memastikan tombol memanjang */
        }

        .btn:active {
            transform: scale(0.94);
            background: var(--accent-color);
            color: white;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">Dr</div>
        <h1>rtnh</h1>
        <p class="bio">high school web</p>

        <div class="btn-container">
            <a href="https://www.instagram.com/dimasonze?igsh=M253NzBocWN6cWF0&utm_source=qr" class="btn">INSTAGRAM</a>
            <a href="portfolio.html" class="btn">PORTFOLIO</a>
        </div>
    </div>

</body>
</html>
