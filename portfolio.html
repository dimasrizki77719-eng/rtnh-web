<!DOCTYPE html>

    <style>

        .tag { display: inline-block; background: rgba(0, 136, 255, 0.1); color: var(--accent); font-size: 11px; padding: 4px 8px; border-radius: 5px; margin-top: 10px; font-weight: bold; }

</head>
<body>

    <div class="header">

            <div class="tag">HTML5</div> <div class="tag">CSS3</div> <div class="tag">MOBILE DEV</div>
